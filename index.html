<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Prayer Tracker - Waktu Shalat Otomatis 🚀</title>
    <!-- Library QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Background Gradient Hijau Emerald Elegan */
            background: linear-gradient(135deg, #059669 0%, #047857 50%, #064e3b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .card h2 {
            color: #047857;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .badge-prayer {
            display: inline-block;
            background-color: #ecfdf5;
            color: #047857;
            font-size: 14px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        /* DESAIN TOMBOL SCAN QR HIJAU ELEGAN */
        .btn-scan {
            width: 100%;
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: none;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-scan:active {
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.2);
        }

        /* Container Kamera Pemindai */
        #scanner-container {
            display: none;
            margin-top: 20px;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #10b981;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.15);
        }

        #reader {
            width: 100%;
            background: #000000;
        }

        #status {
            margin-top: 20px;
            font-size: 15px;
            font-weight: 700;
            color: #64748b;
            min-height: 24px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>My Prayer Tracker 🚀</h2>
    <div id="prayerDisplay" class="badge-prayer">Mendeteksi...</div>

    <!-- Tombol Scan QR -->
    <button id="scanBtn" class="btn-scan" onclick="toggleScanner()">
        📷 Ambil Poin Pahala
    </button>

    <!-- Kamera Pemindai Bersih -->
    <div id="scanner-container">
        <div id="reader"></div>
    </div>

    <div id="status">Arahkan kameramu & kumpulkan pahalanya! ✨</div>
</div>

<script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtBFeIlVhsOAgqslsZaCgwOQTWnKcr8QU5QjpshXyXBOue1cSlmqFBmkoyCrJbZfvC0g/exec";

    let currentPrayer = "";
    let html5QrCode = null;
    let isScanning = false;

    // VARIABLE FITUR PENCEGAHAN DOUBLE SCAN
    let lastScannedCode = "";
    let lastScannedTime = 0;
    const COOLDOWN_MS = 5000; // Jeda 5 detik untuk ID QR yang sama

    // FITUR BEEP SOUND
    function playBeepSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = "sine";
            oscillator.frequency.value = 880; // Suara Bip

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);
            oscillator.stop(audioCtx.currentTime + 0.15);
        } catch (e) {
            console.log("Audio error:", e);
        }
    }

    // ==========================================
    // PENGATURAN WAKTU SHALAT OTOMATIS
    // ==========================================

    // GANTI dengan koordinat sekolah Anda.
    // Contoh:
    // const LATITUDE = -6.123456;
    // const LONGITUDE = 106.123456;
    const LATITUDE = -6.844441;
    const LONGITUDE = 107.911976;

    // 20 = Kementerian Agama Republik Indonesia
    const CALCULATION_METHOD = 20;

    let prayerTimes = {
        Fajr: null,
        Sunrise: null,
        Dhuhr: null,
        Asr: null,
        Maghrib: null,
        Isha: null
    };

    // Mengubah HH:MM menjadi jumlah menit sejak 00:00
    function timeToMinutes(time) {
        if (!time) return null;

        // API kadang mengembalikan format "04:38 (WIB)"
        const cleanTime = String(time).split(" ")[0];
        const [hours, minutes] = cleanTime.split(":").map(Number);

        return (hours * 60) + minutes;
    }

    // Mengambil jadwal shalat hari ini dari AlAdhan API
    async function loadPrayerTimes() {
        try {
            const now = new Date();

            const day = String(now.getDate()).padStart(2, "0");
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const year = now.getFullYear();

            const date = `${day}-${month}-${year}`;

            const API_URL =
                `https://api.aladhan.com/v1/timings/${date}` +
                `?latitude=${LATITUDE}` +
                `&longitude=${LONGITUDE}` +
                `&method=${CALCULATION_METHOD}`;

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const result = await response.json();

            if (result.code !== 200 || !result.data || !result.data.timings) {
                throw new Error("Data waktu shalat tidak valid.");
            }

            prayerTimes = result.data.timings;

            console.log("Jadwal shalat hari ini:", prayerTimes);

            // Tampilkan waktu yang berhasil diambil di console
            console.log("Subuh   :", prayerTimes.Fajr);
            console.log("Sunrise :", prayerTimes.Sunrise);
            console.log("Dzuhur  :", prayerTimes.Dhuhr);
            console.log("Ashar   :", prayerTimes.Asr);
            console.log("Maghrib :", prayerTimes.Maghrib);
            console.log("Isya    :", prayerTimes.Isha);

            autoSelectPrayer();

        } catch (error) {
            console.error("Gagal mengambil waktu shalat:", error);

            currentPrayer = "Shalat Sunnah";

            const prayerBadge = document.getElementById("prayerDisplay");

            prayerBadge.innerText = "⚠️ Waktu shalat tidak tersedia";
            prayerBadge.style.backgroundColor = "#fee2e2";
            prayerBadge.style.color = "#dc2626";
        }
    }

    // Menentukan shalat berdasarkan waktu sekarang
    function autoSelectPrayer() {
        if (!prayerTimes.Fajr) {
            return;
        }

        const now = new Date();
        const currentMins = now.getHours() * 60 + now.getMinutes();

        const fajr = timeToMinutes(prayerTimes.Fajr);
        const sunrise = timeToMinutes(prayerTimes.Sunrise);
        const dhuhr = timeToMinutes(prayerTimes.Dhuhr);
        const asr = timeToMinutes(prayerTimes.Asr);
        const maghrib = timeToMinutes(prayerTimes.Maghrib);
        const isha = timeToMinutes(prayerTimes.Isha);

        if (currentMins >= fajr && currentMins < sunrise) {
            currentPrayer = "Subuh";
        } else if (currentMins >= dhuhr && currentMins < asr) {
            currentPrayer = "Dzuhur";
        } else if (currentMins >= asr && currentMins < maghrib) {
            currentPrayer = "Ashar";
        } else if (currentMins >= maghrib && currentMins < isha) {
            currentPrayer = "Maghrib";
        } else if (currentMins >= isha || currentMins < fajr) {
            currentPrayer = "Isya";
        } else {
            currentPrayer = "Shalat Sunnah";
        }

        const prayerBadge = document.getElementById("prayerDisplay");

        if (currentPrayer === "Shalat Sunnah") {
            prayerBadge.innerText = "Waktu: Shalat Sunnah ✨";
            prayerBadge.style.backgroundColor = "#fef3c7";
            prayerBadge.style.color = "#d97706";
        } else {
            prayerBadge.innerText = "Waktu Shalat: " + currentPrayer;
            prayerBadge.style.backgroundColor = "#ecfdf5";
            prayerBadge.style.color = "#047857";
        }
    }

    function toggleScanner() {
        if (!isScanning) {
            startScanner();
        } else {
            stopScanner();
        }
    }

    function startScanner() {
        const container = document.getElementById("scanner-container");
        const statusDiv = document.getElementById("status");
        const scanBtn = document.getElementById("scanBtn");

        container.style.display = "block";
        statusDiv.innerText = "Arahkan kameramu ke QR Code... ✨";
        statusDiv.style.color = "#059669";
        scanBtn.innerHTML = "❌ Tutup Kamera";

        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }

        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 220, height: 220 } },
            onScanSuccess,
            onScanError
        ).then(() => {
            isScanning = true;
        }).catch(err => {
            statusDiv.innerText = "❌ Gagal membuka kamera. Izinkan akses kamera!";
            statusDiv.style.color = "#ef4444";
        });
    }

    function stopScanner() {
        const container = document.getElementById("scanner-container");
        const scanBtn = document.getElementById("scanBtn");

        if (html5QrCode && isScanning) {
            html5QrCode.stop().then(() => {
                container.style.display = "none";
                scanBtn.innerHTML = "📷 Ambil Poin Pahala";
                isScanning = false;
            }).catch(err => console.error(err));
        } else {
            container.style.display = "none";
            scanBtn.innerHTML = "📷 Ambil Poin Pahala";
            isScanning = false;
        }
    }

    function onScanSuccess(decodedText) {
        const now = Date.now();

        if (decodedText === lastScannedCode && (now - lastScannedTime) < COOLDOWN_MS) {
            return;
        }

        lastScannedCode = decodedText;
        lastScannedTime = now;

        playBeepSound();

        let statusDiv = document.getElementById("status");
        stopScanner();

        // Ambil lokasi GPS tepat saat QR berhasil dipindai.
        // Tidak ada radius/geofence: lokasi hanya dicatat.
        statusDiv.innerText = "📍 Meminta izin lokasi...";
        statusDiv.style.color = "#059669";

        if (!navigator.geolocation) {
            statusDiv.innerText = "❌ Perangkat/browser tidak mendukung lokasi GPS.";
            statusDiv.style.color = "#ef4444";
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(position) {
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                statusDiv.innerText =
                    "📍 Lokasi ditemukan (akurasi ±" + Math.round(accuracy) + " m). Menyimpan...";
                statusDiv.style.color = "#059669";

                fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        studentId: decodedText,
                        prayerName: currentPrayer,
                        latitude: latitude,
                        longitude: longitude,
                        accuracy: accuracy
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.status === "success") {
                        statusDiv.innerText = "✅ " + data.message;
                        statusDiv.style.color = "#10b981";
                    } else {
                        statusDiv.innerText = "❌ " + data.message;
                        statusDiv.style.color = "#ef4444";
                    }
                })
                .catch(error => {
                    console.error("Gagal mengirim absensi:", error);
                    statusDiv.innerText = "❌ Gagal terhubung ke server!";
                    statusDiv.style.color = "#ef4444";
                });
            },
            function(error) {
                console.error("GPS error:", error);

                let message = "❌ Lokasi GPS tidak dapat diambil.";

                if (error.code === 1) {
                    message = "❌ Izin lokasi ditolak. Izinkan lokasi lalu scan kembali.";
                } else if (error.code === 2) {
                    message = "❌ Lokasi tidak tersedia. Aktifkan GPS/lokasi perangkat.";
                } else if (error.code === 3) {
                    message = "❌ Pengambilan lokasi terlalu lama. Coba scan kembali.";
                }

                statusDiv.innerText = message;
                statusDiv.style.color = "#ef4444";
            },
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    }

    function onScanError(errorMessage) {
        // Abaikan error per-frame
    }

    // Ambil jadwal shalat otomatis saat halaman dibuka
    loadPrayerTimes();

    // Perbarui penentuan shalat setiap 30 detik
    setInterval(() => {
        autoSelectPrayer();
    }, 30000);

    // Ambil ulang jadwal setiap pergantian hari.
    // Ini juga mengantisipasi halaman yang dibiarkan terbuka semalaman.
    setInterval(() => {
        const now = new Date();

        if (now.getHours() === 0 && now.getMinutes() === 1) {
            loadPrayerTimes();
        }
    }, 60000);
</script>

</body>
</html>
